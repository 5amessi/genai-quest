[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-intelligence"
version = "0.1.0"
description = "Security-first, Azure-mappable enterprise RAG reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19,<2.0",
  "PyJWT[crypto]>=2.10,<3.0",
]
observability = [
  "azure-monitor-opentelemetry>=1.6,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"data/demo" = "app/demo_corpus"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires explicitly configured external services",
  "evaluation: deterministic quality and security evaluation",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80
